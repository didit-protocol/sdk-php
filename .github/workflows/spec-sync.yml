name: Spec sync

# docs/DESIGN.md section 3.1: download the upstream OpenAPI documents daily and,
# when they changed, regenerate the SDK, run every check and open (or update)
# the pull request "chore(spec): sync API spec YYYY-MM-DD" from chore/spec-sync.
#
# A pull request opened or pushed with the default GITHUB_TOKEN does not trigger
# other workflows, so CI would not run on it. When the SPEC_SYNC_TOKEN secret is
# set (a fine-grained token or GitHub App token with contents and pull-requests
# write access to this repository), it is used instead and CI runs as usual.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync API spec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BRANCH: chore/spec-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SPEC_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Exits non-zero (and writes nothing) when a new operation has no SDK
      # naming: add it to openapi/overlay.json (or x-didit-sdk upstream).
      - name: Download the upstream documents
        id: sync
        run: |
          set -euo pipefail
          python3 codegen/spec_sync.py --summary-file "$RUNNER_TEMP/summary.md"
          if [ -n "$(git status --porcelain -- openapi)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream change." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.sync.outputs.changed == 'true'
        with:
          php-version: '8.4'
          extensions: json, openssl
          coverage: none
          tools: composer:v2

      # composer.lock is not committed for this library.
      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Regenerate the SDK
        if: steps.sync.outputs.changed == 'true'
        run: python3 codegen/generate.py

      - name: Generator tests
        if: steps.sync.outputs.changed == 'true'
        run: python3 -m unittest discover -s codegen/tests

      - name: PHPUnit
        if: steps.sync.outputs.changed == 'true'
        run: composer test

      - name: PHPStan (level max)
        if: steps.sync.outputs.changed == 'true'
        run: composer analyse -- --no-progress

      - name: PHP-CS-Fixer
        if: steps.sync.outputs.changed == 'true'
        run: composer lint

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          title="$(head -n 1 "$RUNNER_TEMP/summary.md")"
          tail -n +3 "$RUNNER_TEMP/summary.md" > "$RUNNER_TEMP/body.md"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --force-create "$BRANCH"
          git add --all -- openapi src tests/Generated
          git commit --quiet --message "$title" --message "Generated by .github/workflows/spec-sync.yml from the upstream OpenAPI documents."

          # Push only when the content differs from the open branch, so an
          # unchanged sync does not re-run CI every day.
          if git fetch --quiet --depth=1 origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "chore/spec-sync already has this content."
          else
            git push --force origin "$BRANCH"
          fi

          number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
