name: Release Please

# Opens and updates the release pull request from conventional commits.
# Merging that pull request creates the vX.Y.Z tag and the GitHub release,
# which triggers publish.yml. Nothing runs until a maintainer sets the
# repository variable RELEASES_ENABLED to "true" after the first release is
# approved (not before the 2026-11-01 Didit release).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
