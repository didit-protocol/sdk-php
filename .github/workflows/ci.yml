name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.os }}${{ matrix.dependencies == 'lowest' && ', lowest deps' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          - os: ubuntu-latest
            php: '8.1'
            dependencies: lowest
          - os: macos-latest
            php: '8.4'
            dependencies: highest
          - os: windows-latest
            php: '8.4'
            dependencies: highest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: PHPStan (level max)
        run: composer analyse -- --no-progress
      - name: PHP-CS-Fixer
        run: composer lint
      - name: Syntax of the framework examples (not analysed by PHPStan)
        run: |
          set -euo pipefail
          find examples/webhooks/laravel examples/webhooks/symfony -name '*.php' -print0 | xargs -0 -n1 php -l

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Generator tests
        run: python3 -m unittest discover -s codegen/tests
      - name: Regenerate and compare
        run: python3 codegen/generate.py --check

  coverage:
    name: Core coverage (90 % minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Tests with coverage of the hand-written core
        run: |
          set -euo pipefail
          vendor/bin/phpunit --testsuite unit --coverage-text --only-summary-for-coverage-text --colors=never | tee coverage.txt
          lines=$(grep -E '^\s*Lines:' coverage.txt | head -n1 | sed -E 's/.*Lines:\s+([0-9.]+)%.*/\1/')
          echo "Core line coverage: ${lines}%"
          awk -v value="$lines" 'BEGIN { exit !(value >= 90) }' || { echo "::error::Core line coverage ${lines}% is below 90%"; exit 1; }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned by version and SHA-256)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .
