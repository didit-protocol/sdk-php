name: Publish

# Cuts the release that a merged Release Please pull request asks for.
# Packagist has no upload step: it publishes every tag it reads from the
# repository, so the tag itself is the publish. release-please.yml therefore
# never tags; this workflow finds the merged release pull request still
# labelled "autorelease: pending", runs the checks on its merge commit, and
# then (in the packagist environment, which holds its secrets) lets
# Release Please create the vX.Y.Z tag and the GitHub release. It then attests
# a source archive, attaches it to the release and asks Packagist to update.
# A release made with the default token starts no other workflow, which is why
# all of this happens here and not on a release event. See CONTRIBUTING.md for
# the one-time setup. Nothing runs until the repository variable
# RELEASES_ENABLED is "true".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pending:
    name: Find the release to cut
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - name: Merged release pull request waiting for its tag
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shas="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged \
            --label 'autorelease: pending' --json mergeCommit --jq '.[].mergeCommit.oid')"
          count="$(grep -c . <<< "$shas" || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::More than one merged release pull request is labelled 'autorelease: pending'."
            exit 1
          fi
          echo "sha=$shas" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No release to cut." >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: Verify the release
    needs: pending
    if: needs.pending.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Version.php matches the release manifest
        run: |
          set -euo pipefail
          version=$(php -r 'require "src/Version.php"; echo Didit\Version::VERSION;')
          manifest=$(php -r 'echo json_decode(file_get_contents(".release-please-manifest.json"), true)["."];')
          if [ "${version}" != "${manifest}" ]; then
            echo "::error::Didit\\Version::VERSION ${version} does not match .release-please-manifest.json ${manifest}"
            exit 1
          fi
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Tests and static checks
        run: |
          set -euo pipefail
          composer validate --strict --no-check-lock
          vendor/bin/phpunit --testsuite unit
          composer analyse -- --no-progress

  publish:
    name: Tag, attest and announce to Packagist
    needs: verify
    runs-on: ubuntu-latest
    environment: packagist
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Creates the tag and the GitHub release for the merged release pull
      # request and relabels it "autorelease: tagged". This is the publish.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Build the distribution archive (what Composer installs, per .gitattributes export-ignore)
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git archive --format=zip --prefix="sdk-php-${TAG#v}/" -o "sdk-php-${TAG}.zip" "${TAG}"
          sha256sum "sdk-php-${TAG}.zip" | tee "sdk-php-${TAG}.zip.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.release.outputs.release_created == 'true'
        with:
          subject-path: sdk-php-${{ steps.release.outputs.tag_name }}.zip
      - name: Attach the archive to the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "${TAG}" "sdk-php-${TAG}.zip" "sdk-php-${TAG}.zip.sha256" --clobber
      - name: Ask Packagist to update the package
        if: steps.release.outputs.release_created == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "PACKAGIST_USERNAME/PACKAGIST_TOKEN not set: relying on the Packagist GitHub integration."
            exit 0
          fi
          curl -sSf -X POST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/didit-protocol/sdk-php"}}'
