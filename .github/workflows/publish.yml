name: Publish

# Runs only when a GitHub release is published (created by Release Please).
# Packagist has no upload step: it reads tags from the repository. This
# workflow checks the release, builds the distribution archive Composer
# installs, attests its provenance, attaches it to the release and asks
# Packagist to update the package. See CONTRIBUTING.md for the one-time setup.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Tag matches the SDK version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(php -r 'require "src/Version.php"; echo Didit\Version::VERSION;')
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Release tag ${TAG} does not match Didit\\Version::VERSION ${version}"
            exit 1
          fi
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Tests and static checks
        run: |
          set -euo pipefail
          composer validate --strict --no-check-lock
          vendor/bin/phpunit --testsuite unit
          composer analyse -- --no-progress

  publish:
    name: Attest and announce to Packagist
    needs: verify
    runs-on: ubuntu-latest
    environment: packagist
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the distribution archive (what Composer installs, per .gitattributes export-ignore)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="sdk-php-${TAG#v}/" -o "sdk-php-${TAG}.zip" "${TAG}"
          sha256sum "sdk-php-${TAG}.zip" | tee "sdk-php-${TAG}.zip.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdk-php-${{ github.event.release.tag_name }}.zip
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" "sdk-php-${TAG}.zip" "sdk-php-${TAG}.zip.sha256" --clobber
      - name: Ask Packagist to update the package
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "PACKAGIST_USERNAME/PACKAGIST_TOKEN not set: relying on the Packagist GitHub integration."
            exit 0
          fi
          curl -sSf -X POST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/didit-protocol/sdk-php"}}'
