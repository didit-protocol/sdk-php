name: Bug report
description: Something in the PHP SDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, webhook secrets, access tokens or personal data. For security issues use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal code to reproduce
      render: php
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Exception class, message and request id (`$e->requestId`), with secrets removed.
      render: text
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version and HTTP client
      placeholder: PHP 8.3, guzzlehttp/guzzle 7.9
    validations:
      required: true
